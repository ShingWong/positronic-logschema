software: pvl
identity_key: who
time_field: ts
record_layers:
  envelope:
    - {path: who, role: identity, type: str, meaning: visitor identifier}
    - {path: ts, role: context, type: float, meaning: visit timestamp}
  payload:
    - {path: desc, role: content, type: str, meaning: free-text visit note}
    - {path: room, role: context, type: str, meaning: room visited}
    - {path: loc, role: context, type: str, meaning: building location}
    - {path: acc, role: context, type: str, meaning: access type code}
    - {path: n, role: context, type: int, meaning: party size count}
classes:
  - name: routine_visit_no_note
    template: ""
    meaning: a routine visit with no note
    normal: true
    retention: demote
