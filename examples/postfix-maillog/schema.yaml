software: postfix
identity_key: [ident, pid]
time_field: stamp

record_layers:
  envelope:
    - {path: stamp, role: context, type: timestamp, meaning: "syslog write time; the measured clock. BSD syslog omits the year, so this is a reconstruction from a named source."}
    - {path: host, role: context, type: string, meaning: "the syslog host that wrote the line. Measured at one distinct value across 300,000 lines, so it is recorded but never used as a key."}
    - {path: ident, role: identity, type: string, meaning: "the syslog program tag, e.g. a postfix service or a content-filter helper. Kept verbatim: deriving a program name from it by last path segment is a false merge."}
    - {path: pid, role: identity, type: string, meaning: "the process id. Measured with ident as a session key at 47 events per key, median span 2 minutes."}
  payload:
    - {path: message, role: content, type: string, meaning: "the free-text line written by the program, and the only place the postfix queue id appears."}

classes:
  - name: connect_from
    template: "connect from"
    meaning: "an inbound SMTP session was accepted from a remote client."
    normal: true
    retention: demote

  - name: disconnect_from
    template: "disconnect from"
    meaning: "an inbound SMTP session was closed."
    normal: true
    retention: demote

  - name: connect_to_relay
    template: "connect to"
    meaning: "an outbound connection to a remote mail host was opened."
    normal: true
    retention: demote

  - name: sasl_login_failed
    template: "SASL LOGIN authentication failed"
    meaning: "a client failed SASL LOGIN authentication. The largest warning class here and the bulk of bot traffic."
    normal: false
    retention: keep-extended

  - name: sasl_plain_failed
    template: "SASL PLAIN authentication failed"
    meaning: "a client failed SASL PLAIN authentication."
    normal: false
    retention: keep-extended

  - name: lost_connection_after
    template: "lost connection after"
    meaning: "the connection was dropped immediately after a named protocol step."
    normal: false
    retention: keep-extended

  - name: timeout_after
    template: "timeout after"
    meaning: "the client stalled at a protocol step until the session timed out."
    normal: false
    retention: keep-extended

  - name: command_time_limit
    template: "COMMAND TIME LIMIT"
    meaning: "a client hit the command time limit without completing a command."
