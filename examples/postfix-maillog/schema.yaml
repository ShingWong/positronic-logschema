software: postfix
identity_key: [svc, pid]
time_field: stamp

record_layers:
  envelope:
    - {path: file, role: context, type: str, meaning: "Log file the collector rotated this line into."}
    - {path: stamp, role: context, type: str, meaning: "ISO8601 stamp written by the collector; the measured event clock."}
  payload:
    - {path: ident, role: identity, type: str, meaning: "Syslog tag carried over the wire."}
    - {path: pid, role: identity, type: str, meaning: "Syslog PID of the process that emitted the line."}
    - {path: svc, role: identity, type: str, meaning: "Daemon name split out of the syslog tag."}
    - {path: q, role: context, type: structured, meaning: "Queue-ID list attached by the mail pipeline."}
    - {path: tok, role: content, type: str, meaning: "Masked free-text message the daemon wrote."}

classes:
  - name: smtpd_disconnect_from
    template: "disconnect from"
    meaning: smtpd tearing down the SMTP conversation with a remote client.
    normal: true
    retention: demote
